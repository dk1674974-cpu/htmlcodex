<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background: #082c6c;
            color: #fff;
        }
        .game{
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            justify-content: center;
            align-items: center;
        }
        .title{
            position: absolute;
            top: 0;
            font-size: 4rem;
            z-index: 2;
        }
        .score{
            display: flex;
            width: 30vw;
            justify-content: space-evenly;
            position: absolute;
            top: 70px;
            z-index: 1;
        }
        .p-count,.c-count{
            text-align: center;
            font-size: 1.5rem;
            margin-top: 1rem;
        }
        .options{
            display: flex;
            width: 50vw;
            justify-content: space-evenly;
            margin-top: 2rem;
        }
        .rock, .paper, .scissor{
            padding: 0.8;
            width: 100px;
            border-radius: 10px;
            background: green;
            outline: none;
            border-color: green;
            border: none;
            cursor: pointer;
        }
        .move{
            font-size: 2rem;
            font-weight: bold;
        }
        .reload{
            display: none;
            margin-top: 2rem;
            padding: 1rem;
            background: green;
            outline: none;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result{
            margin-top: 20px;
            font-size: 1.2rem;
        }
        @media screen and (max-width: 612px) {
            .title{
                text-align: center;
            }
            .score{
                position: absolute;
                top: 200px;
                width: 100vw;
            }
            .options{
                width: 100vw;
            }
        }
    </style>
</head>
<body>
    <section class="Game">
        <div class="Title">Rock Paper Scissor</div>
        <div class="Score">
            <div class="PlayerScore">
                <h2>Player</h2>
                <p class="p-count count">0</p>
            </div>
            <div class="ComputerScore">
                <h2>Computer</h2>
                <p class="c-count count">0</p>
            </div>
        </div>
        <div class="movesleft">Moves Left: 10</div>
        <div class="move">Choose your move</div>
        <div class="options">
            <button class="rock">Rock</button>
            <button class="paper">Paper</button>
            <button class="scissor">Scissor</button>
        </div>
        <div class="result"></div>
        <button class="reload"></button>
    </section>

            let ComputerScore = 0;
            let moves = 0;
        }
        const playGame = () => {
            const rockBtn = document.querySelector('.rock')

    </script>
</body>
</html>
